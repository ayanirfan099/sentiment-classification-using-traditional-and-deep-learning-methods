[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "sentiment-study"
version = "0.1.0"
description = "Classical sentiment models and explicit transformer inference"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.4", "matplotlib>=3.8", "torch>=2.2", "transformers>=4.44", "joblib>=1.3", "streamlit>=1.40"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
[project.scripts]
sentiment-study = "sentiment_study.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
